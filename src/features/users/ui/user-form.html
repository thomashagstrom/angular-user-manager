<main>
  <form (ngSubmit)="onSubmit()" class="user-form">
    <mat-card class="form-card">
      <mat-card-header>
        <mat-card-title>Edit user</mat-card-title>
        <mat-card-subtitle>Update user details and settings</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="form-content">
        <div class="fields-grid">
          <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input matInput type="text" placeholder="Username" [formField]="userForm.userName!" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input
              matInput
              type="text"
              placeholder="First Name"
              [formField]="userForm.firstName!"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput type="text" placeholder="Last Name" [formField]="userForm.lastName!" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" placeholder="Email" [formField]="userForm.email!" />
          </mat-form-field>

          <mat-checkbox placeholder="Enabled" [formField]="userForm.enabled!">Enabled</mat-checkbox>
        </div>
      </mat-card-content>
      <mat-card-actions align="end">
        <button matButton="tonal" type="submit" [disabled]="userForm().invalid()">Save</button>
      </mat-card-actions>
    </mat-card>
  </form>
</main>
