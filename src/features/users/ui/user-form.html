<main>
  <div class="content">
    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <input matInput type="text" placeholder="Username" [formField]="userForm.userName!" />
        @if (userForm.userName().invalid()) {
          <mat-error *ngIf="userForm.userName()?.errors?.['required']"
            >Username is required.</mat-error
          >
          <mat-error *ngIf="userForm.userName()?.errors?.['minlength']"
            >Username must be at least 3 characters.</mat-error
          >
          <mat-error *ngIf="userForm.userName()?.errors?.['maxlength']"
            >Username cannot exceed 20 characters.</mat-error
          >
        }
        <mat-hint>Your username must be between 3 and 20 characters.</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <input matInput type="text" placeholder="First Name" [formField]="userForm.firstName!" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <input matInput type="text" placeholder="Last Name" [formField]="userForm.lastName!" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <input matInput type="email" placeholder="Email" [formField]="userForm.email!" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <input matInput type="checkbox" placeholder="Enabled" [formField]="userForm.enabled!" />
        Enabled
        <mat-hint>Is user enabled?</mat-hint>
      </mat-form-field>

      <button matButton="tonal" type="submit" [disabled]="userForm().invalid()">Save</button>
    </form>
  </div>
</main>
